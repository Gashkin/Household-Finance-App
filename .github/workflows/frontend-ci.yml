name: Required CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test story coordination and integration guards
        run: python3 -m unittest discover -s delivery/tests -v
      - name: Validate local-only analysis scripts
        run: python3 -m py_compile AnalysisScripts/inspect_workbook.py AnalysisScripts/inspect_budget.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend domain tests
        working-directory: frontend
        shell: bash
        run: |
          shopt -s nullglob
          tests=(tests/*.test.ts)
          if (( ${#tests[@]} > 0 )); then
            node --experimental-strip-types --test "${tests[@]}"
          else
            echo "No domain tests yet"
          fi
      - name: Typecheck and build frontend
        working-directory: frontend
        run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Stage built app for single-origin release verification
        run: mkdir -p backend/target/classes/static && cp -r frontend/dist/. backend/target/classes/static/
      - name: Test and package backend
        working-directory: backend
        run: mvn --batch-mode --no-transfer-progress verify
      - name: Install browser for the report journey
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify debt report in desktop and mobile browsers
        working-directory: frontend
        run: npm run test:e2e
      - name: Retain synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-browser-evidence
          path: frontend/test-results/
          if-no-files-found: ignore
