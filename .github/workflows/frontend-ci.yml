name: Required CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test story coordination and integration guards
        run: python3 -m unittest discover -s delivery/tests -v
      - name: Validate local-only analysis scripts
        run: |
          python3 -m py_compile AnalysisScripts/inspect_workbook.py AnalysisScripts/inspect_budget.py AnalysisScripts/audit_history_exposure.py
          python3 -m unittest discover -s AnalysisScripts -p test_audit_history_exposure.py -v
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Check frontend dependency advisories
        run: |
          node --test AnalysisScripts/test_frontend_advisories.test.mjs
          node AnalysisScripts/check_frontend_advisories.mjs
      - name: Run frontend domain tests
        working-directory: frontend
        shell: bash
        run: |
          shopt -s nullglob
          tests=(tests/*.test.ts)
          if (( ${#tests[@]} > 0 )); then
            node --experimental-strip-types --test "${tests[@]}"
          else
            echo "No domain tests yet"
          fi
      - name: Typecheck and build frontend
        working-directory: frontend
        run: npm run build
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Stage built app for single-origin release verification
        run: mkdir -p backend/target/classes/static && cp -r frontend/dist/. backend/target/classes/static/
      - name: Test and package backend
        working-directory: backend
        run: mvn --settings ../.mvn/settings.xml --batch-mode --no-transfer-progress verify
      - name: Install browser for the report journey
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify debt report in desktop and mobile browsers
        working-directory: frontend
        run: npm run test:e2e
      - name: Retain synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: report-browser-evidence
          path: frontend/test-results/
          if-no-files-found: ignore
