name: Windows release verification
on:
  pull_request:
    paths: ['windows/**', 'backend/**', 'frontend/**', '.github/workflows/windows-release.yml', 'product/stories/persistent-aib-instance.md', 'product/stories/local-finance-instance.md']
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.5'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
          cache: maven
      - name: Prepare checksum-pinned Maven
        shell: pwsh
        run: ./windows/Initialize-Maven.ps1
      - name: Build complete Windows release
        shell: pwsh
        run: |
          # Synthetic ignored-output probes: neither may affect the exact-source package.
          New-Item -ItemType Directory -Path backend/target/classes -Force | Out-Null
          'synthetic stale resource' | Set-Content -LiteralPath backend/target/classes/synthetic-stale-resource.txt
          'throw new Error("stale generated Vite config executed")' | Set-Content -LiteralPath frontend/vite.config.js
          ./windows/Build-Release.ps1 -Output "$env:RUNNER_TEMP/household-finance"
          $entries=& "$env:JAVA_HOME/bin/jar.exe" tf "$env:RUNNER_TEMP/household-finance/app.jar"
          if ($LASTEXITCODE -ne 0 -or @($entries | Where-Object { $_ -like '*synthetic-stale-resource*' }).Count) { throw 'Ignored stale output entered the package.' }
      - name: Verify Windows package using synthetic data
        shell: powershell
        run: ./windows/Test-Release.ps1 -Package "$env:RUNNER_TEMP/household-finance"
      - name: Record independently retrievable package digest
        shell: pwsh
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $manifest=Get-Content -LiteralPath "$env:RUNNER_TEMP/household-finance/manifest.json" -Raw | ConvertFrom-Json
          if ($env:EXPECTED_SOURCE_SHA -notmatch '^[0-9a-f]{40}$' -or $manifest.commit -cne $env:EXPECTED_SOURCE_SHA) { throw 'Package source commit mismatch.' }
          $digest=(Get-FileHash -LiteralPath "$env:RUNNER_TEMP/household-finance.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          @('## Synthetic release candidate', "Source commit: $($manifest.commit)", "Package ZIP SHA256: $digest", 'This digest is published in the authenticated workflow summary, separately from the ZIP. It is not production approval.') | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: household-finance-windows
          path: ${{ runner.temp }}/household-finance.zip
          if-no-files-found: error
