name: Windows release verification
on:
  pull_request:
    paths: ['windows/**', 'backend/**', 'frontend/**', '.github/workflows/windows-release.yml', 'product/stories/persistent-aib-instance.md']
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build complete Windows release
        shell: pwsh
        run: ./windows/Build-Release.ps1 -Output "$env:RUNNER_TEMP/household-finance"
      - name: Verify Windows package using synthetic data
        shell: powershell
        run: ./windows/Test-Release.ps1 -Package "$env:RUNNER_TEMP/household-finance"
      - uses: actions/upload-artifact@v4
        with:
          name: household-finance-windows
          path: ${{ runner.temp }}/household-finance.zip
          if-no-files-found: error
