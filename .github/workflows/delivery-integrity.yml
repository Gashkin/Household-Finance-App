name: Story delivery integrity

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft, closed]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to recheck after resolving review threads
        required: true
        type: number
  workflow_run:
    workflows: [Required CI]
    types: [completed]

# Serialize check publication; each queued event re-reads current GitHub state.
concurrency:
  group: story-delivery-integrity
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  checks: write
  actions: read

jobs:
  delivery-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      (github.event_name != 'workflow_run' ||
      ((github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push') || github.event.workflow_run.event == 'pull_request')) &&
      (github.event_name != 'issue_comment' || github.event.issue.pull_request)
    steps:
      # Never use the PR head/merge ref in this token-bearing workflow.
      # The new coordinator becomes active after this bootstrap PR reaches main.
      - name: Check out trusted integration code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.16'
      - name: Verify ownership, CI, resolved threads and main integration
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m delivery.ci
      - name: Retain actionable delivery receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delivery-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: delivery-receipt.json
          if-no-files-found: ignore
