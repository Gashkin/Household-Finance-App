name: Story delivery integrity

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, closed]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_thread:
    types: [resolved, unresolved]
  workflow_run:
    workflows: [Required CI]
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

jobs:
  delivery-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push')
    steps:
      - name: Check out reviewed main for privileged event types
        if: github.event_name == 'workflow_run' || github.event.action == 'closed'
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Check out PR for read-only validation
        if: github.event_name != 'workflow_run' && github.event.action != 'closed'
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify ownership, single review and main integration
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m delivery.ci
      - name: Retain actionable delivery receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-receipt-${{ github.run_id }}
          path: delivery-receipt.json
          if-no-files-found: ignore
