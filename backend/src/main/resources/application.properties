spring.datasource.url=jdbc:h2:file:./data/household-finance;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
# Never silently baseline a pre-migration database or ignore a newer schema.
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
spring.flyway.validate-on-migrate=true
spring.flyway.ignore-migration-patterns=
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Preserve exact decimal literals before converting scenario rates to BigDecimal.
spring.jackson2.deserialization.use-big-decimal-for-floats=true
spring.http.converters.preferred-json-mapper=jackson2

# Intake is locked unless an operator configures a key; external extraction is opt-in.
evidence.intake.access-key=${EVIDENCE_INTAKE_ACCESS_KEY:}
evidence.ai.enabled=${EVIDENCE_AI_ENABLED:false}
evidence.ai.endpoint=${EVIDENCE_AI_ENDPOINT:}
evidence.ai.model=${EVIDENCE_AI_MODEL:}
evidence.ai.key=${EVIDENCE_AI_KEY:}
evidence.ai.daily-limit=${EVIDENCE_AI_DAILY_LIMIT:5}

# Single-household development boundary; production authentication is not supplied.
server.address=${SERVER_ADDRESS:127.0.0.1}

# One local operator; all financial routes require a short-lived cookie session.
workspace.password=${WORKSPACE_PASSWORD:}
workspace.origins=${WORKSPACE_ORIGINS:http://127.0.0.1:5173,http://localhost:5173}
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.tracking-modes=cookie

# Read-only synthetic sandbox connection. Production is rejected by provider metadata.
bank.sandbox.enabled=${BANK_SANDBOX_ENABLED:false}
bank.sandbox.app-id=${BANK_SANDBOX_APP_ID:}
bank.sandbox.key-path=${BANK_SANDBOX_KEY_PATH:}
bank.sandbox.callback=${BANK_SANDBOX_CALLBACK:http://127.0.0.1:5173/bank/callback}

# Production is opt-in only through protected local provisioning after readiness.
bank.production.enabled=${BANK_PRODUCTION_ENABLED:false}
bank.production.app-id=${BANK_PRODUCTION_APP_ID:}
bank.production.key-path=${BANK_PRODUCTION_KEY_PATH:}
bank.production.callback=${BANK_PRODUCTION_CALLBACK:http://127.0.0.1:8080/bank/callback}
bank.production.store-path=${BANK_PRODUCTION_STORE_PATH:}
bank.production.storage-key=${BANK_PRODUCTION_STORAGE_KEY:}
bank.production.readiness=${BANK_PRODUCTION_READINESS:false}

# Development/synthetic workbook workflow; installed launchers force this off.
workbook.import.enabled=${WORKBOOK_IMPORT_ENABLED:true}
